<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERCITY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050914; }
#city { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="city"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const NEON = [0x00eaff, 0xff2bd6, 0x7b2cff, 0xffb347, 0x3dff9a, 0xff4d6d, 0x4d9dff];

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070c1c);
scene.fog = new THREE.FogExp2(0x0a1226, 0.0055);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(80, 60, 95);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById("city").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 25;
controls.maxDistance = 190;
controls.maxPolarAngle = Math.PI / 2.05;
controls.target.set(0, 10, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

/* ---------- post-processing (glow) ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 0.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- lighting ---------- */
scene.add(new THREE.AmbientLight(0x6f86c0, 1.0));
scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x2a1250, 1.2));

const moon = new THREE.DirectionalLight(0xa8c0ff, 1.6);
moon.position.set(-60, 90, 40);
scene.add(moon);

const roamLights = [];
[0x00eaff, 0xff2bd6, 0x7b2cff, 0xffb347, 0x3dff9a].forEach((c, i) => {
    const l = new THREE.PointLight(c, 2500, 90, 2);
    l.position.set(0, 12, 0);
    l.userData = { r: rand(18, 42), s: rand(0.15, 0.35), p: i * 1.3, h: rand(8, 20) };
    scene.add(l);
    roamLights.push(l);
});

/* ---------- ground & roads ---------- */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x0b1226, roughness: 0.55, metalness: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

const grid = new THREE.GridHelper(400, 100, 0x00eaff, 0x14305a);
grid.position.y = -0.02;
grid.material.transparent = true;
grid.material.opacity = 0.18;
scene.add(grid);

const STEP = 8;
const HALF = 24;                       // building sites from -24..24
const ROAD_W = 3;
const roadCoords = [];
for (let c = -HALF - 4; c <= HALF + 4; c += STEP) roadCoords.push(c);
const ROAD_LEN = HALF * 2 + 16;

function makeGlowTexture() {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 128;
    const ctx = cv.getContext("2d");
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.35, "rgba(255,255,255,0.35)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(cv);
}
const glowTex = makeGlowTexture();

function makeAsphaltTexture(lines) {
    const cv = document.createElement("canvas");
    cv.width = 128; cv.height = 256;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#171d33";
    ctx.fillRect(0, 0, 128, 256);
    for (let i = 0; i < 3500; i++) {
        const v = Math.random();
        ctx.fillStyle = v < 0.5 ? "rgba(0,0,0,0.25)" : "rgba(120,140,190,0.10)";
        ctx.fillRect(Math.random() * 128, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    for (let i = 0; i < 14; i++) {                      // darker wet patches
        ctx.fillStyle = "rgba(5,8,18,0.28)";
        ctx.beginPath();
        ctx.ellipse(Math.random() * 128, Math.random() * 256, 8 + Math.random() * 18, 6 + Math.random() * 14, 0, 0, 6.28);
        ctx.fill();
    }
    if (lines) {
        ctx.fillStyle = "rgba(190,200,225,0.45)";       // edge lines
        ctx.fillRect(7, 0, 3, 256);
        ctx.fillRect(118, 0, 3, 256);
        ctx.fillStyle = "rgba(255,196,80,0.85)";        // double yellow centre
        ctx.fillRect(59, 0, 3, 256);
        ctx.fillRect(66, 0, 3, 256);
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    return t;
}

const roadTex = makeAsphaltTexture(true);
roadTex.repeat.set(1, ROAD_LEN / 8);
const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.3, metalness: 0.35 });
const plainMat = new THREE.MeshStandardMaterial({ map: makeAsphaltTexture(false), roughness: 0.3, metalness: 0.35 });

roadCoords.forEach(c => {
    [0, 1].forEach(axis => {
        const g = new THREE.Group();
        const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, ROAD_LEN), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02;
        g.add(road);
        if (axis === 0) g.position.x = c;
        else { g.rotation.y = Math.PI / 2; g.position.z = c; }
        scene.add(g);
    });
});

/* intersections: plain asphalt + zebra crossings */
const nI = roadCoords.length * roadCoords.length;
const patch = new THREE.InstancedMesh(new THREE.PlaneGeometry(ROAD_W, ROAD_W).rotateX(-Math.PI / 2), plainMat, nI);
const zebra = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xc8d2ea, transparent: true, opacity: 0.55, depthWrite: false }),
    nI * 24
);
const _o = new THREE.Object3D();
let pi = 0, zi = 0;
roadCoords.forEach(a => roadCoords.forEach(b => {
    _o.position.set(a, 0.03, b); _o.scale.set(1, 1, 1); _o.updateMatrix(); patch.setMatrixAt(pi++, _o.matrix);
    [-1, 1].forEach(sd => {
        for (let i = 0; i < 6; i++) {
            const o = -1.1 + i * 0.44;
            _o.position.set(a + o, 0.04, b + sd * 2.1); _o.scale.set(0.24, 1, 0.9); _o.updateMatrix(); zebra.setMatrixAt(zi++, _o.matrix);
            _o.position.set(a + sd * 2.1, 0.04, b + o); _o.scale.set(0.9, 1, 0.24); _o.updateMatrix(); zebra.setMatrixAt(zi++, _o.matrix);
        }
    });
}));
scene.add(patch, zebra);

/* sidewalk slabs under every block, with a dim neon curb */
const slabGeo = new THREE.BoxGeometry(5, 0.16, 5);
const slabMat = new THREE.MeshStandardMaterial({ color: 0x252f52, roughness: 0.75, metalness: 0.15 });
for (let x = -HALF; x <= HALF; x += STEP) {
    for (let z = -HALF; z <= HALF; z += STEP) {
        const slab = new THREE.Mesh(slabGeo, slabMat);
        slab.position.set(x, 0.08, z);
        scene.add(slab);
        const curb = new THREE.LineSegments(
            new THREE.EdgesGeometry(slabGeo),
            new THREE.LineBasicMaterial({ color: new THREE.Color(pick(NEON)).multiplyScalar(0.45) })
        );
        curb.position.copy(slab.position);
        scene.add(curb);
    }
}

/* ---------- window texture ---------- */
function makeWindowTexture() {
    const cv = document.createElement("canvas");
    cv.width = 64; cv.height = 128;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0d1630";
    ctx.fillRect(0, 0, 64, 128);
    const warm = ["#ffd27a", "#ffe9b0", "#ffb347"];
    const cool = ["#00eaff", "#7be8ff", "#b48cff", "#ff6fe0", "#ffffff"];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 4; c++) {
            const lit = Math.random() < 0.62;
            ctx.fillStyle = lit ? (Math.random() < 0.5 ? pick(warm) : pick(cool)) : "#111a38";
            ctx.fillRect(c * 16 + 3, r * 16 + 3, 10, 10);
        }
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.magFilter = THREE.NearestFilter;
    return t;
}
const windowTextures = Array.from({ length: 6 }, makeWindowTexture);

/* ---------- buildings ---------- */
const buildings = [];
const blinkers = [];
const wallColors = [0x1c2a4e, 0x24345c, 0x182446, 0x2a2f5e];

for (let x = -HALF; x <= HALF; x += STEP) {
    for (let z = -HALF; z <= HALF; z += STEP) {
        if (Math.hypot(x, z) < 10) continue;          // room for the tower
        if (Math.random() < 0.08) continue;

        const dist = Math.hypot(x, z);
        const height = rand(8, 20) + Math.max(0, 22 - dist) * 0.6 + (Math.random() < 0.12 ? rand(8, 16) : 0);
        const w = rand(3.4, 4.4);
        const d = rand(3.4, 4.4);

        const tex = pick(windowTextures).clone();
        tex.needsUpdate = true;
        tex.repeat.set(1, Math.max(1, Math.round(height / 9.6)));

        const side = new THREE.MeshStandardMaterial({
            color: pick(wallColors),
            map: tex,
            emissive: 0xffffff,
            emissiveMap: tex,
            emissiveIntensity: 1.1,
            metalness: 0.3,
            roughness: 0.55
        });
        const roof = new THREE.MeshStandardMaterial({ color: 0x2c3c6e, metalness: 0.5, roughness: 0.4 });

        const b = new THREE.Mesh(new THREE.BoxGeometry(w, height, d), [side, side, roof, roof, side, side]);
        b.position.set(x + rand(-0.1, 0.1), height / 2, z + rand(-0.1, 0.1));
        b.userData = { side, base: 1.1, pulse: 0, phase: rand(0, 6.28), speed: rand(0.6, 1.6) };
        scene.add(b);
        buildings.push(b);

        /* neon outline */
        const neonColor = pick(NEON);
        const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(b.geometry),
            new THREE.LineBasicMaterial({ color: neonColor })
        );
        edges.position.copy(b.position);
        scene.add(edges);

        /* neon roof strip */
        const strip = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.12, 0.18, d + 0.12),
            new THREE.MeshBasicMaterial({ color: neonColor })
        );
        strip.position.set(b.position.x, height + 0.09, b.position.z);
        scene.add(strip);

        /* neon sign on a facade */
        if (Math.random() < 0.45) {
            const sw = rand(1.2, 2.2), sh = rand(0.5, 1.4);
            const sign = new THREE.Mesh(
                new THREE.PlaneGeometry(sw, sh),
                new THREE.MeshBasicMaterial({ color: pick(NEON), side: THREE.DoubleSide })
            );
            const face = Math.floor(Math.random() * 4);
            const sy = rand(3, height - 2);
            if (face === 0) { sign.position.set(b.position.x + w / 2 + 0.05, sy, b.position.z); sign.rotation.y = Math.PI / 2; }
            if (face === 1) { sign.position.set(b.position.x - w / 2 - 0.05, sy, b.position.z); sign.rotation.y = Math.PI / 2; }
            if (face === 2) { sign.position.set(b.position.x, sy, b.position.z + d / 2 + 0.05); }
            if (face === 3) { sign.position.set(b.position.x, sy, b.position.z - d / 2 - 0.05); }
            scene.add(sign);
            blinkers.push({ mesh: sign, phase: rand(0, 6), speed: rand(1, 4), type: "sign" });
        }

        /* rooftop antenna + blinking light on tall ones */
        if (height > 16) {
            const ant = new THREE.Mesh(
                new THREE.CylinderGeometry(0.04, 0.06, 3, 6),
                new THREE.MeshBasicMaterial({ color: 0x8aa0d0 })
            );
            ant.position.set(b.position.x, height + 1.5, b.position.z);
            scene.add(ant);
            const lamp = new THREE.Mesh(
                new THREE.SphereGeometry(0.22, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff2040 })
            );
            lamp.position.set(b.position.x, height + 3.1, b.position.z);
            scene.add(lamp);
            blinkers.push({ mesh: lamp, phase: rand(0, 6), speed: rand(2, 3.5), type: "lamp" });
        }
    }
}

/* ---------- street lights (instanced) ---------- */
const lampPos = [];
roadCoords.forEach(a => roadCoords.forEach(b => {
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => lampPos.push([a + sx * 1.8, b + sz * 1.8]));
}));
const poleMesh = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.04, 0.05, 3.4, 5),
    new THREE.MeshBasicMaterial({ color: 0x4a5a85 }),
    lampPos.length
);
const bulbMesh = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff }),
    lampPos.length
);
const lampPool = new THREE.InstancedMesh(          // light pooled on the road
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }),
    lampPos.length
);
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
lampPos.forEach(([lx, lz], i) => {
    const col = Math.random() < 0.75 ? 0xffc98a : 0x8fe0ff;
    dummy.scale.set(1, 1, 1);
    dummy.position.set(lx, 1.7, lz); dummy.updateMatrix(); poleMesh.setMatrixAt(i, dummy.matrix);
    dummy.position.set(lx, 3.5, lz); dummy.updateMatrix(); bulbMesh.setMatrixAt(i, dummy.matrix);
    dummy.position.set(lx * 0.85, 0.05, lz * 0.85); dummy.scale.set(6, 1, 6); dummy.updateMatrix(); lampPool.setMatrixAt(i, dummy.matrix);
    bulbMesh.setColorAt(i, tmpColor.set(col));
    lampPool.setColorAt(i, tmpColor.set(col));
});
scene.add(poleMesh, bulbMesh, lampPool);

/* neon light spilled on the wet road */
const SPILLS = 70;
const spill = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }),
    SPILLS
);
for (let i = 0; i < SPILLS; i++) {
    const c = pick(roadCoords), along = rand(-HALF - 4, HALF + 4), sz = rand(4, 9);
    if (Math.random() < 0.5) dummy.position.set(c + rand(-0.8, 0.8), 0.055, along);
    else dummy.position.set(along, 0.055, c + rand(-0.8, 0.8));
    dummy.scale.set(sz, 1, sz); dummy.updateMatrix();
    spill.setMatrixAt(i, dummy.matrix);
    spill.setColorAt(i, tmpColor.set(pick(NEON)).multiplyScalar(0.8));
}
scene.add(spill);

/* ---------- traffic (instanced cars) ---------- */
const CAR_COUNT = 160;
const carMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0xffffff }),
    CAR_COUNT
);
const cars = [];
for (let i = 0; i < CAR_COUNT; i++) {
    const axis = Math.random() < 0.5 ? 0 : 1;
    const dir = Math.random() < 0.5 ? 1 : -1;
    cars.push({
        axis, dir,
        road: pick(roadCoords),
        lane: dir * 0.75,
        pos: rand(-ROAD_LEN / 2, ROAD_LEN / 2),
        speed: rand(5, 14)
    });
    carMesh.setColorAt(i, tmpColor.set(pick([0xff3b5c, 0xffe27a, 0xffffff, 0x00eaff, 0xff2bd6, 0x7bffb0])));
}
scene.add(carMesh);

/* ---------- central tower ---------- */
const tower = new THREE.Mesh(
    new THREE.CylinderGeometry(5, 7, 45, 6),
    new THREE.MeshStandardMaterial({
        color: 0x1b2c58, metalness: 0.8, roughness: 0.25,
        emissive: 0x0a2a5a, emissiveIntensity: 0.8
    })
);
tower.position.y = 22.5;
scene.add(tower);

const towerEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(tower.geometry),
    new THREE.LineBasicMaterial({ color: 0x00eaff })
);
towerEdges.position.copy(tower.position);
scene.add(towerEdges);

const rings = [];
const ringGeo = new THREE.TorusGeometry(6.2, 0.2, 12, 64);
for (let y = 4; y < 44; y += 6) {
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: y % 12 < 6 ? 0x00eaff : 0xff2bd6 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;
    ring.userData.y = y;
    scene.add(ring);
    rings.push(ring);
}

const beacon = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.25, 40, 8),
    new THREE.MeshBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.85 })
);
beacon.position.y = 65;
scene.add(beacon);

const beaconLight = new THREE.PointLight(0x00eaff, 6000, 120, 2);
beaconLight.position.y = 50;
scene.add(beaconLight);

/* ---------- flying drones / sparkles ---------- */
const DRONES = 90;
const dronePos = new Float32Array(DRONES * 3);
const droneData = [];
const droneCol = new Float32Array(DRONES * 3);
for (let i = 0; i < DRONES; i++) {
    droneData.push({
        r: rand(10, 50), a: rand(0, 6.28), s: rand(0.1, 0.5) * (Math.random() < 0.5 ? 1 : -1),
        h: rand(6, 38), hp: rand(0, 6), hs: rand(0.3, 1.2)
    });
    tmpColor.set(pick(NEON));
    droneCol.set([tmpColor.r, tmpColor.g, tmpColor.b], i * 3);
}
const droneGeo = new THREE.BufferGeometry();
droneGeo.setAttribute("position", new THREE.BufferAttribute(dronePos, 3));
droneGeo.setAttribute("color", new THREE.BufferAttribute(droneCol, 3));
const drones = new THREE.Points(droneGeo, new THREE.PointsMaterial({
    size: 1.1, vertexColors: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
}));
drones.frustumCulled = false;
scene.add(drones);

/* ---------- stars ---------- */
const sp = [];
for (let i = 0; i < 1500; i++) sp.push(rand(-1, 1) * 300, rand(40, 200), rand(-1, 1) * 300);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xbfeaff, size: 0.7, transparent: true, opacity: 0.85, fog: false
}));
scene.add(stars);

/* ---------- click = light pulse ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downX = 0, downY = 0;
addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; });
addEventListener("pointerup", e => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return; // was a drag
    mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(buildings)[0];
    if (hit) hit.object.userData.pulse = 1;
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
const signBase = new Map();

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    stars.rotation.y = t * 0.01;

    /* windows twinkle + click pulse */
    for (const b of buildings) {
        const u = b.userData;
        u.pulse = Math.max(0, u.pulse - dt * 0.8);
        u.side.emissiveIntensity = u.base + Math.sin(t * u.speed + u.phase) * 0.22 + u.pulse * 3;
    }

    /* signs flicker, lamps blink */
    for (const bl of blinkers) {
        if (bl.type === "lamp") {
            bl.mesh.visible = Math.sin(t * bl.speed + bl.phase) > -0.2;
        } else {
            const f = Math.sin(t * bl.speed + bl.phase);
            bl.mesh.visible = !(f > 0.96);
            bl.mesh.scale.setScalar(1 + Math.sin(t * 2 + bl.phase) * 0.04);
        }
    }

    /* roaming colour lights */
    for (const l of roamLights) {
        const u = l.userData;
        const a = t * u.s + u.p;
        l.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 0.8 + u.p) * 3, Math.sin(a) * u.r);
    }

    /* traffic */
    for (let i = 0; i < CAR_COUNT; i++) {
        const c = cars[i];
        c.pos += c.speed * c.dir * dt;
        if (c.pos > ROAD_LEN / 2) c.pos = -ROAD_LEN / 2;
        if (c.pos < -ROAD_LEN / 2) c.pos = ROAD_LEN / 2;
        if (c.axis === 0) {
            dummy.position.set(c.road + c.lane, 0.25, c.pos);
            dummy.scale.set(0.5, 0.3, 1.1);
        } else {
            dummy.position.set(c.pos, 0.25, c.road + c.lane);
            dummy.scale.set(1.1, 0.3, 0.5);
        }
        dummy.updateMatrix();
        carMesh.setMatrixAt(i, dummy.matrix);
    }
    carMesh.instanceMatrix.needsUpdate = true;

    /* drones */
    for (let i = 0; i < DRONES; i++) {
        const d = droneData[i];
        d.a += d.s * dt;
        dronePos[i * 3] = Math.cos(d.a) * d.r;
        dronePos[i * 3 + 1] = d.h + Math.sin(t * d.hs + d.hp) * 3;
        dronePos[i * 3 + 2] = Math.sin(d.a) * d.r;
    }
    droneGeo.attributes.position.needsUpdate = true;

    /* tower */
    tower.position.y = 22.5 + Math.sin(t * 1.2) * 0.2;
    towerEdges.position.y = tower.position.y;
    rings.forEach((r, i) => {
        r.position.y = r.userData.y + Math.sin(t * 1.2) * 0.2;
        r.scale.setScalar(1 + Math.sin(t * 3 - i * 0.7) * 0.06);
    });
    beacon.scale.y = 1 + Math.sin(t * 3) * 0.15;
    beaconLight.intensity = 5500 + Math.sin(t * 3) * 1500;

    controls.update();
    composer.render();
}
animate();

/* ---------- resize ---------- */
addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
